<div class="heritage-app">
  <app-header />

  <main class="main-content">
    <!-- Main Grid -->
    <div class="container">
      <!-- Section Intro -->
      <div class="section-intro">
        <div class="intro-badge">
          <mat-icon>smart_toy</mat-icon>
          <span>{{ "APP.intro.badge" | translate }}</span>
        </div>
        <h2>
          {{ "APP.intro.title" | translate }}
          <span>{{ "APP.intro.titleHighlight" | translate }}</span>
        </h2>
        <p>{{ "APP.intro.description" | translate }}</p>
      </div>

      <div class="grid-layout">
        <!-- Left: Chat with integrated upload -->
        <div class="left-column">
          <app-chat-box />
        </div>

        <!-- Right: Results and Analysis -->
        <div class="right-column">
          <app-results-card />
          <app-explanation-tabs />
        </div>
      </div>
    </div>
  </main>

  <app-footer />
</div>
