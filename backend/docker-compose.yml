# ==========================================
# ICHeritage Backend - Standalone Docker Compose
# For testing backend independently
# ==========================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icheritage-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5001}:5001"
    env_file:
      - .env
    environment:
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      - PORT=5001
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MODEL_PATH=/app/weight/best.pt
      - CSV_PATH=/app/uploads/artifacts/merged_data.csv
      - UPLOAD_FOLDER=/app/uploads
    volumes:
      - ./weight:/app/weight:ro
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Development version with hot reload
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: icheritage-backend-dev
    ports:
      - "${PORT:-5001}:5001"
    env_file:
      - .env
    environment:
      - FLASK_DEBUG=True
      - PORT=5001
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MODEL_PATH=/app/weight/best.pt
      - CSV_PATH=/app/uploads/artifacts/merged_data.csv
      - UPLOAD_FOLDER=/app/uploads
    volumes:
      - .:/app
      - /app/__pycache__
    profiles:
      - dev
