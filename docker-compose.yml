# ==========================================
# ICHeritage - Full Stack Docker Compose
# Vietnamese Cultural Heritage Detection System
# Optimized for CPU Speed & Standalone Hosting Deployment
# ==========================================

services:
  # ==========================================
  # BACKEND - Python Flask + YOLO (OpenVINO)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: icheritage-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    env_file:
      - ./backend/.env
    environment:
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      - PORT=5001
      - HOST=0.0.0.0
      # Tối ưu: Trỏ trực tiếp vào thư mục mô hình OpenVINO đã nhúng bên trong Image
      - MODEL_PATH=/app/weight/best_openvino_model
      - CSV_PATH=/app/uploads/artifacts/merged_data.csv
      - UPLOAD_FOLDER=/app/uploads
    volumes:
      # Giữ lại Volume này để lưu giữ ảnh/video người dùng upload lên không bị mất khi restart
      - backend-uploads:/app/uploads
    networks:
      - icheritage-network
    healthcheck:
      # Sửa lỗi: Dùng thư viện urllib mặc định của Python (Không cần cài thêm gói requests)
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================
  # FRONTEND - Angular + Nginx
  # ==========================================
  frontend:
    build:
      context: ./interface-angular
      dockerfile: Dockerfile
    container_name: icheritage-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - icheritage-network
    healthcheck:
      # Sửa lỗi: Sử dụng wget có sẵn của Alpine thay vì curl để tránh lỗi vặt báo đỏ
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

# ==========================================
# NETWORKS
# ==========================================
networks:
  icheritage-network:
    driver: bridge

# ==========================================
# VOLUMES
# ==========================================
volumes:
  backend-uploads:
    driver: local
